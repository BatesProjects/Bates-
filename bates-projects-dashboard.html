<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bates Projects — Business Dashboard</title>
<style>
  :root{
    /* Bates Projects brand — charcoal-green base. Tweak these to match
       your logo file exactly if this estimate is a little off. */
    --bg: #24261f;
    --bg-elevated: #2a2c23;
    --bg-card: #33362b;
    --bg-input: #1c1e17;
    --border: #4a4d3d;
    --border-soft: #3b3e31;
    --text: #f2f1e8;
    --text-dim: #b4b3a1;
    --text-faint: #86856f;
    --accent: #a9c98f;
    --accent-dim: #87a86b;
    --accent-soft: rgba(169,201,143,0.16);
    --highlight: #d8c084;
    --success: #8fd18f;
    --warning: #e0c368;
    --danger: #e0806f;
    --radius: 10px;
    --radius-sm: 6px;
    font-size: 15px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    min-height:100vh;
  }
  a{ color: inherit; text-decoration:none; }
  h1,h2,h3,h4{ margin:0 0 4px 0; font-weight:700; letter-spacing:-0.01em; }
  p{ margin:0 0 10px 0; }
  .muted{ color: var(--text-dim); }
  .faint{ color: var(--text-faint); font-size:12.5px; }

  /* ---------- Layout ---------- */
  #sidebar{
    width: 236px;
    flex-shrink:0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding: 18px 12px;
    position: sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding: 8px 10px 18px 10px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 14px;
  }
  /* Recreated in CSS from the logo's wordmark (bold BATES over tracked
     PROJECTS). Swap this block for an <img src="data:..."> tag if you
     want the exact raster logo embedded instead. */
  .brand .logo-word{ font-size:21px; font-weight:800; letter-spacing:0.07em; line-height:1; color: var(--text); }
  .brand .logo-sub{ font-size:10.5px; font-weight:700; letter-spacing:0.32em; color: var(--text-dim); margin-top:5px; }
  .brand .sub{ font-size:11.5px; color: var(--text-faint); margin-top:12px; }

  nav.side-nav{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .nav-link{
    display:flex; align-items:center; gap:10px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--text-dim); font-size:13.5px; font-weight:600;
    cursor:pointer; border:1px solid transparent;
  }
  .nav-link .ic{ font-size:16px; width:20px; text-align:center; }
  .nav-link:hover{ background: var(--bg-card); color: var(--text); }
  .nav-link.active{ background: var(--accent-soft); color: var(--accent); border-color: rgba(169,201,143,0.3); }

  .sidebar-footer{ border-top:1px solid var(--border-soft); padding-top:12px; margin-top:10px; }
  .sidebar-footer .btn-row{ display:flex; gap:6px; margin-bottom:8px; }

  #shell{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 26px; border-bottom: 1px solid var(--border-soft);
    background: var(--bg-elevated);
    position: sticky; top:0; z-index: 5;
  }
  #topbar .title-block .page-title{ font-size:18px; }
  #topbar .title-block .page-crumb{ font-size:12px; color:var(--text-faint); }
  #topbar .top-actions{ display:flex; align-items:center; gap:10px; }
  #saved-indicator{ font-size:11.5px; color: var(--text-faint); }

  #main{ flex:1; padding: 26px; max-width: 1180px; width:100%; margin:0 auto; }

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--bg-card); color: var(--text);
    border:1px solid var(--border); padding: 8px 14px;
    border-radius: var(--radius-sm); font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color:#1c2016; }
  .btn-primary:hover{ background: #bdd9a4; }
  .btn-ghost{ background: transparent; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  .icon-btn{
    background:transparent; border:1px solid var(--border); color: var(--text-dim);
    width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color: var(--text); border-color: var(--text-dim); }
  .icon-btn.danger:hover{ color: var(--danger); border-color: var(--danger); }

  input[type=text], input[type=number], input[type=date], input[type=tel], textarea, select{
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }
  textarea{ resize: vertical; min-height: 34px; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color: var(--accent); }
  label.field-label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); margin-bottom:5px; font-weight:700; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:14px; }

  /* ---------- Home grid ---------- */
  .home-header{ margin-bottom:22px; }
  .home-header h1{ font-size:24px; }
  .card-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }
  .nav-card{
    background: var(--bg-card); border:1px solid var(--border-soft);
    border-radius: var(--radius); padding:18px; cursor:pointer;
    display:flex; flex-direction:column; gap:10px;
    transition: border-color .12s, transform .12s;
  }
  .nav-card:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .nav-card .card-icon{ font-size: 26px; }
  .nav-card h3{ font-size:15.5px; }
  .nav-card p{ font-size:12.5px; color: var(--text-dim); margin-bottom:0; }
  .nav-card .card-stat{ font-size:11.5px; color: var(--accent); font-weight:700; margin-top:auto; padding-top:8px; border-top:1px dashed var(--border-soft); }

  /* ---------- Section chrome ---------- */
  .section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
  .section-head h1{ font-size:21px; }
  .section-head p{ color: var(--text-dim); font-size:13px; max-width:640px; }
  .back-link{ font-size:12.5px; color: var(--text-dim); margin-bottom:10px; display:inline-block; cursor:pointer; }
  .back-link:hover{ color: var(--accent); }

  .subnav{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--border-soft); padding-bottom:10px; }
  .subnav-btn{
    background: transparent; border:1px solid var(--border); color: var(--text-dim);
    padding:7px 12px; border-radius: 999px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .subnav-btn.active{ background: var(--accent-soft); color: var(--accent); border-color: rgba(169,201,143,0.3); }

  .panel{
    background: var(--bg-card); border:1px solid var(--border-soft);
    border-radius: var(--radius); padding:20px; margin-bottom:18px;
  }
  .panel h3{ font-size:14.5px; margin-bottom:4px; }
  .panel .panel-desc{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .panel-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap:16px; }

  /* ---------- Tables ---------- */
  .table-scroll{ overflow-x:auto; margin-bottom:10px; }
  table.data-table{ width:100%; border-collapse: collapse; min-width: 560px; }
  table.data-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em;
    color: var(--text-faint); padding:6px 8px; border-bottom:1px solid var(--border);
    font-weight:700; white-space:nowrap;
  }
  table.data-table td{ padding:5px 6px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
  table.data-table td.col-actions{ width:34px; }
  table.data-table input, table.data-table select, table.data-table textarea{
    background: transparent; border:1px solid transparent; padding:6px 6px;
  }
  table.data-table input:hover, table.data-table select:hover, table.data-table textarea:hover{ border-color: var(--border); }
  table.data-table input:focus, table.data-table select:focus, table.data-table textarea:focus{ background: var(--bg-input); border-color: var(--accent); }
  table.data-table textarea{ min-height:30px; }
  td.computed-cell{ font-weight:700; font-size:13px; color: var(--highlight); white-space:nowrap; padding-left:8px; }
  .empty-row{ text-align:center; color: var(--text-faint); padding:16px !important; font-size:12.5px; }

  select[data-pill]{ font-weight:700; }
  .pill-success{ color: var(--success) !important; border-color: rgba(111,207,151,0.4) !important; }
  .pill-warning{ color: var(--warning) !important; border-color: rgba(242,201,76,0.4) !important; }
  .pill-danger{ color: var(--danger) !important; border-color: rgba(239,91,91,0.4) !important; }
  .pill-neutral{ color: var(--text-dim) !important; }

  /* ---------- Stat cards ---------- */
  .stat-row{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .stat-card{ background: var(--bg-input); border:1px solid var(--border-soft); border-radius: var(--radius-sm); padding:14px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-faint); font-weight:700; margin-bottom:6px; }
  .stat-value{ font-size:20px; font-weight:800; color: var(--accent); }

  /* ---------- Bars (overhead breakdown) ---------- */
  .bar-list{ display:flex; flex-direction:column; gap:10px; }
  .bar-item .bar-item-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .bar-track{ background: var(--bg-input); border-radius:6px; height:8px; overflow:hidden; }
  .bar-fill{ background: linear-gradient(90deg, var(--accent-dim), var(--accent)); height:100%; border-radius:6px; }

  /* ---------- Process steps ---------- */
  .process-steps{ display:flex; flex-direction:column; gap:0; }
  .process-step{ display:flex; gap:14px; padding: 10px 0; border-bottom: 1px dashed var(--border-soft); }
  .process-step:last-child{ border-bottom:none; }
  .process-step .step-num{
    width:30px; height:30px; border-radius:50%; background: var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex-shrink:0;
  }
  .process-step .step-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .process-step .step-detail{ font-size:12.5px; color: var(--text-dim); }

  /* ---------- Checklist ---------- */
  .checklist-item{ display:flex; align-items:flex-start; gap:8px; padding:6px 0; font-size:13px; }
  .checklist-item input[type=checkbox]{ width:16px; height:16px; margin-top:2px; accent-color: var(--accent); }

  /* ---------- Kanban ---------- */
  .kanban{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ background: var(--bg-input); border:1px solid var(--border-soft); border-radius: var(--radius-sm); min-width:220px; flex:1; padding:10px; }
  .kanban-col h4{ font-size:12px; text-transform:uppercase; letter-spacing:0.03em; color: var(--text-dim); display:flex; justify-content:space-between; margin-bottom:10px; }
  .kanban-col h4 .count{ background: var(--bg-card); border-radius:999px; padding:1px 7px; color:var(--text-faint); font-weight:700; }
  .kanban-col.drag-over{ border-color: var(--accent); }
  .kanban-cards{ display:flex; flex-direction:column; gap:8px; min-height: 40px; }
  .kanban-card{
    background: var(--bg-card); border:1px solid var(--border-soft); border-radius:8px;
    padding:10px; cursor: grab; font-size:12.5px;
  }
  .kanban-card:active{ cursor: grabbing; }
  .kanban-card .kc-title{ font-weight:700; margin-bottom:3px; }
  .kanban-card .kc-meta{ color: var(--text-dim); font-size:11.5px; }
  .kanban-card .kc-value{ color: var(--highlight); font-weight:700; font-size:12px; margin-top:4px; }
  .kanban-card .kc-del{ float:right; background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; }
  .kanban-add{ margin-top:12px; background: var(--bg-card); border:1px dashed var(--border); border-radius: var(--radius-sm); padding:12px; }
  .kanban-add .field-row{ margin-bottom:8px; }

  /* ---------- Gantt ---------- */
  .gantt-wrap{ overflow-x:auto; }
  .gantt-chart{ min-width: 100%; }
  .gantt-scale{ font-size:11.5px; color: var(--text-faint); margin-bottom:10px; }
  .gantt-rows{ display:flex; flex-direction:column; gap:6px; }
  .gantt-row{ display:flex; align-items:center; gap:10px; }
  .gantt-row-label{ width:170px; flex-shrink:0; font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gantt-row-track{ position:relative; display:grid; height:26px; background: var(--bg-input); border-radius:5px; flex:1; min-width:400px; }
  .gantt-day-col{ border-right:1px solid var(--border-soft); }
  .gantt-day-col.weekend{ background: rgba(255,255,255,0.02); }
  .gantt-bar{
    grid-row:1; background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius:5px; display:flex; align-items:center; justify-content:center;
    color:#1c2016; font-size:10.5px; font-weight:800; z-index:1; min-width: 18px;
  }

  /* ---------- Compliance ---------- */
  .compliance-item{ display:flex; gap:12px; }
  .compliance-item .ci-icon{ font-size:20px; flex-shrink:0; }
  .compliance-item .ci-title{ font-size:13.5px; font-weight:700; }
  .compliance-item .ci-body{ font-size:12.5px; color:var(--text-dim); }

  /* ---------- Journal (Site Diary) ---------- */
  .journal-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .journal-entry{ background: var(--bg-input); border:1px solid var(--border-soft); border-radius: var(--radius-sm); padding:12px; }
  .journal-entry-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .journal-entry-head input[type=date]{ width:auto; font-weight:700; border-color:transparent; background:transparent; padding-left:0; }
  .journal-entry-head input[type=date]:hover{ border-color: var(--border); }
  .journal-entry textarea{ min-height:70px; }

  /* ---------- To-Do List ---------- */
  .todo-add-row{ display:grid; grid-template-columns: 1fr 150px 120px auto; gap:10px; align-items:end; }
  .todo-list{ display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .todo-row{ display:grid; grid-template-columns: auto 1fr 140px 110px 32px; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid var(--border-soft); }
  .todo-row:last-child{ border-bottom:none; }
  .todo-row input[type=checkbox]{ width:17px; height:17px; accent-color: var(--accent); cursor:pointer; }
  .todo-row.is-done .todo-text-input{ text-decoration: line-through; color: var(--text-faint); }
  .todo-row input, .todo-row select{ background: transparent; border-color: transparent; }
  .todo-row input:hover, .todo-row select:hover{ border-color: var(--border); }
  .todo-row input:focus, .todo-row select:focus{ background: var(--bg-input); border-color: var(--accent); }

  footer.app-footer{ text-align:center; padding: 20px; color: var(--text-faint); font-size:11.5px; }

  @media (max-width: 860px){
    body{ flex-direction:column; }
    #sidebar{ position:relative; height:auto; width:100%; flex-direction:row; align-items:center; overflow-x:auto; }
    .brand{ border-bottom:none; border-right:1px solid var(--border-soft); margin-bottom:0; padding-right:14px; }
    nav.side-nav{ flex-direction:row; }
    .sidebar-footer{ display:none; }
    #main{ padding:16px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="logo-word">BATES</div>
    <div class="logo-sub">PROJECTS</div>
    <div class="sub">Cabarita Beach · Tweed Coast &amp; Northern Rivers</div>
  </div>
  <nav class="side-nav" id="side-nav"></nav>
  <div class="sidebar-footer">
    <div class="btn-row">
      <button class="icon-btn" title="Export backup (JSON)" onclick="exportData()">⭳</button>
      <button class="icon-btn" title="Import backup (JSON)" onclick="document.getElementById('import-file').click()">⭱</button>
      <button class="icon-btn danger" title="Reset all data to sample data" onclick="resetAllData()">↺</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
    <div class="faint">Lic. 480112C · Data stored only in this browser</div>
  </div>
</aside>

<div id="shell">
  <div id="topbar">
    <div class="title-block">
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="page-crumb" id="page-crumb">Home</div>
    </div>
    <div class="top-actions">
      <span id="saved-indicator">—</span>
    </div>
  </div>
  <div id="main"></div>
  <footer class="app-footer">Bates Projects Pty Ltd — internal dashboard. Local data only, not synced or published anywhere.</footer>
</div>

<script>
/* =====================================================================
   BATES PROJECTS — BUSINESS DASHBOARD
   Single-file, dependency-free HTML/CSS/JS. All data lives in
   localStorage under STORAGE_KEY. Edit DEFAULT_DATA below to change
   what a fresh install seeds with — that never overwrites data you've
   already saved in the browser (see mergeDeep / loadState).
===================================================================== */

const STORAGE_KEY = 'batesDashboardData_v1';

/* ---------------------------------------------------------------
   1. DEFAULT / SAMPLE DATA — all placeholder, safe to edit freely.
--------------------------------------------------------------- */
const DEFAULT_DATA = {
  business: {
    vision: {

      { stage: '3. Scope & Quote Dispatch', detail: 'Scope of works drafted, quotes requested from subbies/suppliers, PriceBook used for self-performed and known rates.' },
      { stage: '4. Estimate & Proposal', detail: 'Trade breakdown compiled, margin applied, proposal sent to client.' },
      { stage: '5. Contract & Deposit', detail: 'Contract signed, deposit taken within NSW limits, HBCF certificate obtained if the job value requires it.' },
      { stage: '6. Pre-Start', detail: 'Programme built, materials ordered, compliance documents confirmed, site set up.' },
      { stage: '7. Construction', detail: 'Job runs to programme, site diary kept, variations logged as they arise, progress payments claimed per contract schedule.' },
      { stage: '8. Handover', detail: 'Final inspection, defects list cleared, handover pack (warranties/certificates) given to client, final payment.' },
      { stage: '9. Warranty / Follow-up', detail: 'Statutory warranty period tracked, follow-up call/review, referral request.' }
    ],
    systemsGuide: [
      { system: 'Job Intake', description: 'Standard process for capturing a new enquiry through to an estimate-ready scope before pricing starts.' },
      { system: 'Rapid Quote Dispatch', description: 'Fast-turnaround process for getting plans out to trades and suppliers for pricing the moment drawings land.' },
      { system: 'Scope of Works', description: 'One trade-specific brief per subcontractor, referencing relevant standards (AS 3740 waterproofing, AS/NZS 3500 plumbing, BAL ratings, etc).' },
      { system: 'Estimating', description: 'Five-step build-up: extract requirements, map sub quotes, price self-performed work, compile trade breakdown, QA review.' },

      insurance: { publicLiability: '$20,000,000', insurer: '', policyNumber: '', expiry: '', notes: 'Confirm cover is current before each new contract — clients and principals will often ask for a certificate of currency.' },

      homeBuildingAct: { notes: "Home Building Act 1989 (NSW) — obligations to keep front of mind: written contract required over the small-jobs threshold, statutory warranty period (currently 6 years major defects / 2 years other — verify current figures), cooling-off rights on certain contracts, deposit limits, and mandatory contract terms. This panel is a working reference, not legal advice — re-check against current NSW Fair Trading guidance periodically.", lastVerified: '' }
    }
  },

  pipeline: {
    activeJobs: [
      { client: 'Client A', address: '123 Example St, Cabarita Beach', type: 'Bathroom Renovation', stage: 'In Progress', start: '', finish: '', value: 25000 },
      { client: 'Client B', address: '45 Sample Rd, Pottsville', type: 'Deck', stage: 'Scheduled', start: '', finish: '', value: 14000 }
    ],
    leads: [
      { client: 'Prospect C', address: '9 Placeholder Ave, Kingscliff', buildType: 'Kitchen Renovation', inquiryDate: '', status: 'Initial Contact', contactPhone: '', notes: 'Sample lead row — edit or delete.' },
      { client: 'Prospect D', address: '77 Draft Cres, Tweed Heads', buildType: 'Deck', inquiryDate: '', status: 'Quote Sent', contactPhone: '', notes: '' }

/* ---------------------------------------------------------------
   2. STATE — load from localStorage, merged over DEFAULT_DATA so
   new fields added later don't wipe what you've already entered.
--------------------------------------------------------------- */
function mergeDeep(base, override){
  if(Array.isArray(base)){ return override !== undefined ? override : base; }
  if(base && typeof base === 'object'){
    const result = {...base};
    if(override && typeof override === 'object'){
      Object.keys(override).forEach(k=>{
        result[k] = Object.prototype.hasOwnProperty.call(base,k) ? mergeDeep(base[k], override[k]) : override[k];
      });
    }
    return result;
  }
  return override !== undefined ? override : base;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_DATA);
    return mergeDeep(DEFAULT_DATA, JSON.parse(raw));
  }catch(e){
    console.error('Failed to load saved data, falling back to sample data.', e);
    return structuredClone(DEFAULT_DATA);
  }
}
let state = loadState();

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 350);
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const el = document.getElementById('saved-indicator');
  if(el) el.textContent = 'Saved ' + new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'});
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `bates-dashboard-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Import this file and replace all current dashboard data?')) return;
      state = mergeDeep(DEFAULT_DATA, parsed);
      saveState();
      renderRoute();
    }catch(e){
      alert('Could not read that file — is it a JSON backup exported from this dashboard?');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function resetAllData(){
  if(!confirm('Reset ALL sections back to sample data? This cannot be undone (export a backup first if unsure).')) return;
  state = structuredClone(DEFAULT_DATA);
  saveState();
  renderRoute();
}

/* ---------------------------------------------------------------
   3. HELPERS
--------------------------------------------------------------- */
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null? undefined : o[k]), obj); }
function setPath(obj, path, value){
  const parts = path.split('.');
  const last = parts.pop();
  const target = parts.reduce((o,k)=> o[k], obj);
  target[last] = value;
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatCurrency(n){
  const num = Number(n)||0;
  return '$' + num.toLocaleString('en-AU', {maximumFractionDigits:0});
}
function statusClass(value){
  const v = String(value||'').toLowerCase();
  if(/high|declined|rejected|on hold|expired/.test(v)) return 'pill-danger';
  if(/medium|pending|sent|scheduled/.test(v)) return 'pill-warning';
  if(/low|accepted|approved|complete|paid|in progress|active/.test(v)) return 'pill-success';
  return 'pill-neutral';
}
function parseDateStr(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+Number(n)); return d; }
function dateDiffDays(a,b){ return Math.round((b-a)/86400000); }
function formatDateShort(d){ return d.toLocaleDateString('en-AU', {day:'2-digit', month:'short'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function getTemplate(path){
  if(TABLE_TEMPLATES[path]) return TABLE_TEMPLATES[path]();
  if(/^scheduling\.jobs\.\d+\.tasks$/.test(path)) return { trade:'', start:'', duration:1 };
  return {};
}
function addRow(path, opts={}){
  const rows = getPath(state, path);
  const row = getTemplate(path);
  if(opts.prepend) rows.unshift(row); else rows.push(row);
  scheduleSave();
  renderRoute();
}
function deleteRow(path, idx){
  if(!confirm('Delete this row?')) return;
  const rows = getPath(state, path);
  rows.splice(idx,1);
  scheduleSave();
  renderRoute();
}

const COMPUTED_COLUMNS = {
  'finance.jobMargins': [
    { key:'marginDollar', compute: r => formatCurrency((Number(r.contractValue)||0) - (Number(r.projectedCosts)||0)) },
    { key:'marginPct', compute: r => { const cv = Number(r.contractValue)||0; if(!cv) return '—'; return (((cv - (Number(r.projectedCosts)||0))/cv)*100).toFixed(1)+'%'; } }
  ],
  'marketing.adCampaigns': [
    { key:'costPerLead', compute: r => { const leads = Number(r.leads)||0; if(!leads) return '—'; return formatCurrency((Number(r.spend)||0)/leads); } }
  ],
  'finance.cashFlow.months': [
    { key:'net', compute: r => formatCurrency((Number(r.in)||0) - (Number(r.out)||0)) }
  ]
};
function computedId(tablePath, idx, key){ return 'computed-' + tablePath.replace(/\./g,'-') + '-' + idx + '-' + key; }

function renderCell(col, row, i, path){
  const p = `${path}.${i}.${col.field}`;
  const val = row[col.field];
  if(col.type === 'select'){
    const opts = col.options.map(o => `<option value="${escapeHtml(o)}" ${o===val?'selected':''}>${escapeHtml(o)}</option>`).join('');
    return `<select data-path="${p}" ${col.pill? 'data-pill="true"' : ''} class="${col.pill? statusClass(val):''}">${opts}</select>`;
  }
  if(col.type === 'number'){
    return `<input type="number" step="any" data-path="${p}" value="${val===undefined||val===''?'':val}">`;
  }
  if(col.type === 'date'){
    return `<input type="date" data-path="${p}" value="${escapeHtml(val)}">`;
  }
  if(col.type === 'textarea'){
    return `<textarea data-path="${p}" rows="1">${escapeHtml(val)}</textarea>`;
  }
  return `<input type="text" data-path="${p}" value="${escapeHtml(val)}">`;
}

function renderTable(path, columns, options={}){
  const rows = getPath(state, path) || [];
  const bodyHtml = rows.length ? rows.map((row,i)=>{
    const cells = columns.map(col=>{
      if(col.type === 'computed'){
        return `<td class="computed-cell" id="${computedId(path,i,col.key)}">${col.compute(row)}</td>`;
      }
      return `<td>${renderCell(col,row,i,path)}</td>`;
    }).join('');
    return `<tr>${cells}<td class="col-actions"><button type="button" class="icon-btn danger" title="Delete row" onclick="deleteRow('${path}',${i})">✕</button></td></tr>`;
  }).join('') : `<tr><td colspan="${columns.length+1}" class="empty-row">No rows yet — add one below.</td></tr>`;
  const headers = columns.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('') + '<th></th>';
  return `
    <div class="table-scroll">
      <table class="data-table"><thead><tr>${headers}</tr></thead><tbody>${bodyHtml}</tbody></table>
    </div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="addRow('${path}')">${options.addLabel || '+ Add row'}</button>
  `;
}

/* Freeform dated journal entries (Site Diary) — newest first, prepended on add. */
function renderJournal(path, options={}){
  const rows = getPath(state, path) || [];
  const cards = rows.length ? rows.map((row,i)=>`
    <div class="journal-entry">
      <div class="journal-entry-head">
        <input type="date" data-path="${path}.${i}.date" value="${escapeHtml(row.date)}">
        <button type="button" class="icon-btn danger" title="Delete entry" onclick="deleteRow('${path}',${i})">✕</button>
      </div>
      <textarea data-path="${path}.${i}.text" rows="3" placeholder="${escapeHtml(options.placeholder||'')}">${escapeHtml(row.text)}</textarea>
    </div>
  `).join('') : `<p class="muted">No entries yet — add your first one below.</p>`;
  return `
    <div class="journal-list">${cards}</div>
    <button type="button" class="btn btn-primary btn-sm" onclick="addRow('${path}', {prepend:true})">${options.addLabel || '+ Add entry'}</button>
  `;
}

/* ---------------------------------------------------------------
   5. LIVE INPUT BINDING (delegated) + computed summary refresh
--------------------------------------------------------------- */
function handleInput(e){
  const target = e.target;
  const path = target.dataset ? target.dataset.path : null;
  if(!path) return;
  let val;
  if(target.type === 'checkbox') val = target.checked;
  else if(target.type === 'number') val = target.value === '' ? '' : Number(target.value);
  else val = target.value;
  setPath(state, path, val);
  scheduleSave();

  if(target.tagName === 'SELECT' && target.dataset.pill === 'true'){
    target.classList.remove('pill-success','pill-warning','pill-danger','pill-neutral');
    target.classList.add(statusClass(val));
  }
  refreshComputedForPath(path);
  updateAllComputedSummaries();
}
document.addEventListener('input', handleInput);
document.addEventListener('change', handleInput);

function refreshComputedForPath(path){
  const parts = path.split('.');
  const rowIndex = parts[parts.length - 2];
  if(!/^\d+$/.test(rowIndex)) return;
  const tablePath = parts.slice(0, -2).join('.');
  const cols = COMPUTED_COLUMNS[tablePath];
  if(!cols) return;
  const row = getPath(state, `${tablePath}.${rowIndex}`);
  cols.forEach(c=>{
    const elm = document.getElementById(computedId(tablePath, rowIndex, c.key));
    if(elm) elm.textContent = c.compute(row);
  });
}
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }

function updateAllComputedSummaries(){
  const ov = state.finance.overheads;
  const ovTotal = ov.categories.reduce((s,c)=> s + (Number(c.monthly)||0), 0);
  const rev = Number(ov.monthlyRevenueEstimate) || 0;
  setText('ov-monthly-total', formatCurrency(ovTotal));
  setText('ov-annual-total', formatCurrency(ovTotal*12));
  setText('ov-pct', rev>0 ? ((ovTotal/rev)*100).toFixed(1)+'%' : '—');
  const total = ovTotal || 1;
  ov.categories.forEach((c,i)=>{
    const bar = document.getElementById('ov-bar-fill-'+i);
    const pct = document.getElementById('ov-bar-pct-'+i);
    const share = ((Number(c.monthly)||0)/total*100);
    if(bar) bar.style.width = share.toFixed(1)+'%';
    if(pct) pct.textContent = share.toFixed(0)+'%';
  });

  const cf = state.finance.cashFlow;
  const net = (Number(cf.currentBankBalance)||0) + (Number(cf.outstandingInvoices)||0) - (Number(cf.upcomingBills)||0);
  setText('cf-net', formatCurrency(net));
}

const KANBAN_STAGES = ['Enquiry','Quoted','Contracted','Scheduled','In Progress','Complete'];
function renderKanban(){
  const items = state.pipeline.planner;
  return `
    <div class="panel">
      <h3>Pipeline Planner</h3>
      <p class="panel-desc">Drag cards between stages to see capacity across the whole pipeline at a glance.</p>
      <div class="kanban">
        ${KANBAN_STAGES.map(stage => `
          <div class="kanban-col" data-stage="${stage}" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="onKanbanDrop(event,'${stage}')">
            <h4>${stage} <span class="count">${items.filter(i=>i.stage===stage).length}</span></h4>
            <div class="kanban-cards">
              ${items.map((item,i)=> item.stage===stage ? renderKanbanCard(item,i) : '').join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="kanban-add">
        <div class="field-row">
          <div class="field"><label class="field-label">Title</label><input type="text" id="kb-title" placeholder="e.g. Deck rebuild"></div>

          <div class="field"><label class="field-label">Type</label><input type="text" id="kb-type" placeholder="e.g. Deck"></div>
          <div class="field"><label class="field-label">Est. value</label><input type="number" id="kb-value" placeholder="0"></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addKanbanCard()">+ Add to pipeline</button>
      </div>
    </div>
  `;
}
function renderKanbanCard(item, i){
  return `
    <div class="kanban-card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')">
      <button class="kc-del" title="Remove" onclick="event.stopPropagation(); deleteKanbanCard(${i})">✕</button>
      <div class="kc-title">${escapeHtml(item.title)}</div>
      <div class="kc-meta">${escapeHtml(item.client)} · ${escapeHtml(item.type)}</div>
      ${item.value ? `<div class="kc-value">${formatCurrency(item.value)}</div>` : ''}
    </div>
  `;
}
function onKanbanDrop(e, stage){
  e.currentTarget.classList.remove('drag-over');
  const i = Number(e.dataTransfer.getData('text/plain'));
  if(isNaN(i) || !state.pipeline.planner[i]) return;
  state.pipeline.planner[i].stage = stage;
  scheduleSave();
  document.getElementById('pipeline-body').innerHTML = renderKanban();
}
function addKanbanCard(){
  const title = document.getElementById('kb-title').value.trim();
  if(!title){ alert('Give the card a title first.'); return; }
  state.pipeline.planner.push({
    title,
    client: document.getElementById('kb-client').value.trim(),
    type: document.getElementById('kb-type').value.trim(),
    value: Number(document.getElementById('kb-value').value) || 0,
    stage: 'Enquiry'
  });
  scheduleSave();
  document.getElementById('pipeline-body').innerHTML = renderKanban();
}
function deleteKanbanCard(i){
  if(!confirm('Remove this card from the pipeline planner?')) return;
  state.pipeline.planner.splice(i,1);
  scheduleSave();
  document.getElementById('pipeline-body').innerHTML = renderKanban();
}

  const name = prompt('Job name (e.g. "123 Smith St — Deck"):');
  if(!name) return;
  state.scheduling.jobs.push({ name, tasks: [] });

  renderScheduling(document.getElementById('main'));

function renderGanttChart(job){
  const tasks = (job.tasks||[]).filter(t=>t.start && t.duration);
  if(tasks.length === 0){
    return `<p class="muted">Add tasks below with a start date and a duration to see the programme visualised here.</p>`;
  }
  const starts = tasks.map(t=>parseDateStr(t.start)).filter(Boolean);
  const ends = tasks.map(t=>{ const s=parseDateStr(t.start); return s ? addDays(s, Number(t.duration)||1) : null; }).filter(Boolean);
  if(!starts.length) return `<p class="muted">Add valid dates to see the programme.</p>`;
  const minDate = new Date(Math.min(...starts));
  const maxDate = new Date(Math.max(...ends));
  const totalDays = Math.max(dateDiffDays(minDate, maxDate), 1);
  let dayCols = '';
  for(let i=0;i<=totalDays;i++){
    const d = addDays(minDate,i);
    const weekend = d.getDay()===0 || d.getDay()===6;
    dayCols += `<div class="gantt-day-col ${weekend?'weekend':''}" style="grid-column:${i+1}"></div>`;
  }
  const rows = tasks.map(t=>{
    const s = parseDateStr(t.start);
    const offset = dateDiffDays(minDate, s);
    const dur = Math.max(Number(t.duration)||1, 1);
    return `
      <div class="gantt-row">
        <div class="gantt-row-label" title="${escapeHtml(t.trade)}">${escapeHtml(t.trade || 'Untitled task')}</div>
        <div class="gantt-row-track" style="grid-template-columns: repeat(${totalDays+1}, minmax(22px,1fr));">
          ${dayCols}
          <div class="gantt-bar" style="grid-column: ${offset+1} / span ${dur};" title="${escapeHtml(t.trade)}: ${formatDateShort(s)} – ${formatDateShort(addDays(s,dur))}">${dur}d</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="gantt-chart">
      <div class="gantt-scale">${formatDateShort(minDate)} → ${formatDateShort(maxDate)} · ${totalDays} day span</div>
      <div class="gantt-rows">${rows}</div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   16. TO-DO LIST
--------------------------------------------------------------- */
let todoFilter = 'open';
function renderTodos(main){
  const openCount = state.todos.filter(t=>!t.done).length;
  main.innerHTML = `
    <div class="section-head">
      <div><h1>To-Do List</h1><p>A running list for the business — not job-specific tasks (those live on the job's own programme in Scheduling).</p></div>
    </div>
    <div class="panel">
      <div class="todo-add-row">
        <div class="field"><label class="field-label">New task</label><input type="text" id="todo-new-text" placeholder="e.g. Chase HBCF cert for Client B job" onkeydown="if(event.key==='Enter') addTodo()"></div>
        <div class="field"><label class="field-label">Due (optional)</label><input type="date" id="todo-new-due"></div>
        <div class="field"><label class="field-label">Priority</label>
          <select id="todo-new-priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addTodo()">+ Add task</button>
      </div>
    </div>
    <div class="subnav">
      <button class="subnav-btn ${todoFilter==='open'?'active':''}" onclick="setTodoFilter('open')">Open (${openCount})</button>
      <button class="subnav-btn ${todoFilter==='done'?'active':''}" onclick="setTodoFilter('done')">Done</button>
      <button class="subnav-btn ${todoFilter==='all'?'active':''}" onclick="setTodoFilter('all')">All</button>
    </div>
    <div class="panel" id="todo-list-panel">${renderTodoRows()}</div>
  `;
}
function renderTodoRows(){
  const indexed = state.todos.map((t,i)=>({t,i}));
  const filtered = todoFilter === 'all' ? indexed : indexed.filter(x => todoFilter === 'done' ? x.t.done : !x.t.done);
  if(!filtered.length) return `<p class="muted">Nothing here.</p>`;
  return `<div class="todo-list">${filtered.map(({t,i})=>`
    <div class="todo-row ${t.done?'is-done':''}">
      <input type="checkbox" onchange="toggleTodoDone(${i})" ${t.done?'checked':''}>
      <input type="text" class="todo-text-input" data-path="todos.${i}.text" value="${escapeHtml(t.text)}">
      <input type="date" data-path="todos.${i}.due" value="${escapeHtml(t.due)}">
      <select data-path="todos.${i}.priority" data-pill="true" class="${statusClass(t.priority)}">
        ${['Low','Medium','High'].map(p=>`<option ${p===t.priority?'selected':''}>${p}</option>`).join('')}
      </select>
      <button type="button" class="icon-btn danger" title="Delete task" onclick="deleteRow('todos',${i})">✕</button>
    </div>
  `).join('')}</div>`;
}
function addTodo(){
  const textEl = document.getElementById('todo-new-text');
  const text = textEl.value.trim();
  if(!text){ textEl.focus(); return; }
  state.todos.push({
    text,
    done: false,
    due: document.getElementById('todo-new-due').value,
    priority: document.getElementById('todo-new-priority').value
  });
  scheduleSave();
  renderTodos(document.getElementById('main'));
}
function toggleTodoDone(i){
  state.todos[i].done = !state.todos[i].done;
  scheduleSave();
  renderTodos(document.getElementById('main'));
}
function setTodoFilter(f){ todoFilter = f; renderTodos(document.getElementById('main')); }
